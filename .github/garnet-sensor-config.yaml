#### Jibril Standalone Config File.

run_time:
  log-level: info
  pprof: false # serve net/http/pprof on /debug/pprof.
  health: true
  metrics: false
  cardinal: true
  stdout: stdout
  stderr: stderr
  # api:
  #   token: <your-api-token>

#### Cadences.

cadences:
  file-access: 9
  network-peers: 9
  network-flows: 9

#### Caches (smaller caches for github actions).
#
# Each value sets an eBPF map max_entries in units of 1024 (value x 1024).
# Keys map to kernel maps (jb_*); smaller sizes lower locked memory on the
# short-lived, low-cardinality runners used by github actions.

caches:
  # Task-related: process identity and metadata, keyed by content hash.
  rec-tasks: 64  # jb_rectasks: live PID -> task-hash index.
  tasks: 64      # jb_tasks: main task cache (hash -> full task record).
  cmds: 16       # jb_cmds: command/executable name (hash -> comm).

  # File-related: interned path components and task<->file cross-refs.
  files: 16      # jb_files: full file/path entry (hash -> file).
  dirs: 8        # jb_dirs: interned directory components.
  bases: 16      # jb_bases: interned basename components.
  task-file: 32  # jb_taskfile: (task,file) -> file-hash; files a task touched.
  file-task: 32  # jb_filetask: (file,task) -> task-hash; tasks touching a file.
  task-ref: 32   # task<->file refcounts; no live jb_taskref map (real: jb_filerefs).

  # Network-related: flow state and task<->flow cross-refs.
  flows: 32      # jb_flows: per-flow 5-tuple state (hash -> flow).
  task-flow: 32  # jb_taskflow: (task,flow) -> flow-hash; flows opened by a task.
  flow-task: 32  # jb_flowtask: (flow,task) -> task-hash; tasks behind a flow.
  flow-ref: 32   # flow<->task refcounts; no live jb_flowref map (real: jb_flowrefs).

#### Functionalities.

functionalities:
  - jibril # core jibril functionality (required).

#### features.

features:
  - hold # hold agent execution until ctrl+c (or SIGINT).
  - procfs # enrich running tasks with procfs info at startup.
  - detect # enable the detection feature.
  - rules # load the built-in detection rules (see below).
  - network # report network flows, needed by the flow event below.
  - profile # report the behavioural profile, needed by the profile event below.
  - enricher # enrich events with container information.
  - policy # enforce network policy using netpolicy.yaml.
  # - attenuator # AI-powered event and noise reduction.
  - github # github integration.
  # - transformers # enable the transformers feature.

feature_options:
  policy:
    file: /etc/jibril/netpolicy.yaml
  transformers:
    scoring: false
  github:
  detect:
  attenuator:
    enabled: false
      # url: https://api.openai.com/v1/chat/completions
      # port: 443
      # model: gpt-4o
      # temp: 0.3
      # mode: score
  rules:
    builtin:
      enabled: true

#### Events.

events:
  types:
    # Informational events about network policy applied.
    - dropip
    # Informational events about network flows.
    - flow
    - profile
    # Detection recipes for file access patterns.
    # - file_example
    # - auth_logs_tamper
    - binary_self_deletion
    # - capabilities_modification
    #- code_modification_through_procfs
    - core_pattern_access
    # - cpu_fingerprint
    - credentials_files_access
    - crypto_miner_files
    - environ_read_from_procfs
    # - filesystem_fingerprint
    - global_shlib_modification
    - java_debug_lib_load
    - java_instrument_lib_load
    # - machine_fingerprint
    # - os_fingerprint
    # - os_network_fingerprint
    # - os_status_fingerprint
    - package_repo_config_modification
    - pam_config_modification
    - sched_debug_access
    - shell_config_modification
    # - ssl_certificate_access
    - sudoers_modification
    - sysrq_access
    - unprivileged_bpf_config_access
    - kernel_security_protections_change
    # Detection recipes for execution patterns.
    # - exec_example
    - binary_executed_by_loader
    # - code_on_the_fly
    # - credentials_text_lookup
    # - crypto_miner_execution
    # - data_encoder_exec
    # - denial_of_service_tools
    - exec_from_unusual_dir
    - file_attribute_change
    - hidden_elf_exec
    - interpreter_shell_spawn
    - net_filecopy_tool_exec
    - net_mitm_tool_exec
    - net_scan_tool_exec
    - net_sniff_tool_exec
    # - net_suspicious_tool_exec
    # - passwd_usage
    # - runc_suspicious_exec
    # - webserver_exec
    # - webserver_shell_exec
    # Network peers detections are deprecated and not built. See
    # pkg/deprecated/events/netpeers.

  # Where events are written. A name per output, so several of the same type
  # can coexist. Only restricts an output to some event types.
  outputs:
    - name: console
      type: stdout
      format: json
    - name: audit
      type: file
      path: /var/log/jibril.out
      format: jsonl
    - name: profile_summary
      type: file
      path: /var/log/jibril.profile.md
      format: markdown
      only: [profile]
    - name: profile_json
      type: file
      path: /var/log/jibril.profile.json
      format: json
      only: [profile]
    - name: garnet-ai
      type: garnet
